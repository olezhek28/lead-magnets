<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     role="img" aria-label="Курс System Design: от паники к алгоритму">
  <title>System Design: от паники к алгоритму</title>
  <defs>
    <!-- жёлтый глоу сверху, как на лендинге -->
    <radialGradient id="glow" cx="50%" cy="-6%" r="72%">
      <stop offset="0" stop-color="#DFDF41" stop-opacity=".13"/>
      <stop offset="1" stop-color="#DFDF41" stop-opacity="0"/>
    </radialGradient>
    <!-- техническая сетка 64px -->
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" fill="none" stroke="#FFFFFF" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DFDF41"/>
      <stop offset="1" stop-color="#DFDF41" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#10171A"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- акцентная риска слева -->
  <rect x="96" y="196" width="4" height="188" rx="2" fill="#DFDF41"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">
    <!-- наддомен -->
    <text x="128" y="150" font-size="24" font-weight="500" letter-spacing="1.5"
          fill="#93A09B" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
      guide.olezhek28.courses
    </text>

    <text x="128" y="272" font-size="104" font-weight="700" letter-spacing="-3" fill="#F5F7F6">
      System Design:
    </text>
    <text x="128" y="360" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#DFDF41">
      от паники к алгоритму
    </text>

    <rect x="128" y="428" width="520" height="2" rx="1" fill="url(#rule)"/>

    <text x="128" y="492" font-size="30" font-weight="500" fill="#C4CBCA">
      Как пройти секцию System Design на собесе в бигтех
    </text>
    <text x="128" y="556" font-size="26" font-weight="500" letter-spacing=".5"
          fill="#98A2A2" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
      5 недель · живые разборы · практика
    </text>
  </g>
</svg>
