name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Артефакт собирается из всего репозитория (path: .), поэтому служебное
      # надо выкинуть — иначе оно отдаётся с guide.olezhek28.courses по прямым
      # ссылкам: планы продуктов, инструкции ассистента, исходники idea-board,
      # скрипты сборки черновых превью.
      # Удаляется только в раннере, в репозитории всё остаётся на месте.
      - name: Выкинуть непубличное из артефакта
        run: rm -rf docs scripts .claude tasks idea-board CLAUDE.md README.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
