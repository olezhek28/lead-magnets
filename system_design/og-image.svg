<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     role="img" aria-label="Курс System Design — от паники к алгоритму">
  <title>System Design — от паники к алгоритму</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="-8%" r="75%">
      <stop offset="0" stop-color="#DFDF41" stop-opacity=".14"/>
      <stop offset="1" stop-color="#DFDF41" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" fill="none" stroke="#FFFFFF" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DFDF41"/>
      <stop offset="1" stop-color="#DFDF41" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#10171A"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <rect x="80" y="168" width="4" height="172" rx="2" fill="#DFDF41"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">
    <text x="112" y="122" font-size="22" font-weight="500" letter-spacing="1.4"
          fill="#93A09B" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
      guide.olezhek28.courses
    </text>

    <text x="112" y="248" font-size="94" font-weight="700" letter-spacing="-2.8" fill="#F5F7F6">
