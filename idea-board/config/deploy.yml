service: idea-board
image: godev-vibe/idea-board

servers:
  web:
    - 89.19.208.212

proxy:
  ssl: true
  host: ideas.olezhek28.courses
  app_port: 3100
  healthcheck:
    path: /api/auth/me

registry:
  server: ghcr.io
  username: godev-vibe
  password:
    - KAMAL_REGISTRY_PASSWORD

volumes:
  - "idea-board-data:/app/data"

env:
  secret:
    - TELEGRAM_BOT_TOKEN
    - JWT_SECRET
    - ADMIN_TELEGRAM_ID
  clear:
    TELEGRAM_BOT_USERNAME: idea_board_olezhek28_bot
    NEXT_PUBLIC_APP_URL: https://ideas.olezhek28.courses
    DATABASE_PATH: /app/data/ideas.db

builder:
  arch: amd64
