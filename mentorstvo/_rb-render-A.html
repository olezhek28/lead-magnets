<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #182023; font-family: 'Manrope', system-ui, sans-serif; }
  .og { width: 1200px; height: 630px; position: relative; overflow: hidden; background: #182023; color: #fff; }
  .og__code { position: absolute; inset: 0; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.55; color: #fff; opacity: .055; word-break: break-all; padding: 20px; mask-image: linear-gradient(110deg, transparent 0%, #000 25%, #000 70%, transparent 100%); -webkit-mask-image: linear-gradient(110deg, transparent 0%, #000 25%, #000 70%, transparent 100%); pointer-events: none; }
  .og::before { content: ''; position: absolute; right: -160px; top: -140px; width: 580px; height: 580px; background: radial-gradient(circle, rgba(223,223,65,.18) 0%, transparent 60%); pointer-events: none; }
  .og::after { content: ''; position: absolute; left: -100px; bottom: -120px; width: 420px; height: 420px; background: radial-gradient(circle, rgba(223,223,65,.10) 0%, transparent 60%); pointer-events: none; }

  .og__content { position: absolute; inset: 0; padding: 56px 56px; display: grid; grid-template-columns: 1.1fr .9fr; gap: 36px; align-items: center; }
  .og__left { display: flex; flex-direction: column; justify-content: center; height: 100%; z-index: 2; min-width: 0; position: relative; }
  .og__brand-bottom { position: absolute; top: 0; left: 0; font-size: 22px; color: #fff; font-weight: 600; }
  .og__brand-bottom b { color: #DFDF41; }

  .og__title { font-size: 54px; font-weight: 600; line-height: 1.12; letter-spacing: -1.5px; color: #fff; text-align: center; max-width: 600px; margin: 0 auto; }
  .og__title b { color: #DFDF41; font-weight: 700; }

  .og__stack { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 22px; }
  .og__pill { display: inline-flex; align-items: center; padding: 6px 14px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.12); border-radius: 1000px; font-size: 13px; font-weight: 500; color: #fff; }
  .og__pill--accent { background: rgba(223,223,65,.10); border-color: rgba(223,223,65,.40); color: #DFDF41; }

  .og__bottom { display: flex; align-items: center; gap: 14px; font-size: 16px; color: #8C9296; margin-top: auto; }
  .og__brand { color: #fff; font-weight: 600; }
  .og__brand b { color: #DFDF41; }

  .og__right { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; }
  .terminal { width: 100%; background: linear-gradient(160deg, #1E262B 0%, #11161A 100%); border: 1px solid rgba(255,255,255,.10); border-radius: 22px; padding: 22px 26px 28px; box-shadow: 0 30px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.04) inset; transform: rotate(-1.5deg); }
  .terminal__dots { display: flex; gap: 9px; margin-bottom: 18px; }
  .terminal__dots span { width: 13px; height: 13px; border-radius: 50%; background: #2D353B; }
  .terminal__dots span:nth-child(1) { background: #FF5F57; } .terminal__dots span:nth-child(2) { background: #FEBC2E; } .terminal__dots span:nth-child(3) { background: #28C840; }
  .terminal__label { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #5A6164; margin-bottom: 16px; letter-spacing: 0.5px; }
  .terminal__lines { font-family: 'JetBrains Mono', monospace; font-size: 16.5px; line-height: 1.9; color: #BFC4C7; }
  .terminal__line { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
  .terminal__ok { color: #8BD17C; font-weight: 700; width: 18px; font-size: 18px; }
  .terminal__err { color: #FF8562; font-weight: 700; width: 18px; font-size: 18px; }
  .terminal__method { color: #DFDF41; font-weight: 600; width: 62px; }
  .terminal__path { color: #BFC4C7; flex: 1; }
  .terminal__code { color: #fff; background: rgba(255,255,255,.06); padding: 2px 9px; border-radius: 5px; font-weight: 600; font-size: 14.5px; }
  .terminal__code--ok { color: #8BD17C; background: rgba(139,209,124,.10); }
  .terminal__code--err { color: #FF8562; background: rgba(255,107,107,.10); }
  .terminal__summary { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.06); font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #5A6164; }
  .terminal__summary b { color: #8BD17C; font-weight: 700; }
</style>
</head>
<body>
<div class="og">
  <div class="og__code" id="ogCode"></div>
  <div class="og__content">
    <div class="og__left">
      <h1 class="og__title">Учебный проект, на&nbsp;котором освоишь весь <b>базовый стек гошника</b></h1>
      <div class="og__brand-bottom"><b>{</b> Олег Козырев <b>}</b></div>
    </div>
    <div class="og__right">
      <div class="terminal">
        <div class="terminal__dots"><span></span><span></span><span></span></div>
        <div class="terminal__label">restaurant-booking · e2e tests</div>
        <div class="terminal__lines">
          <div class="terminal__line"><span class="terminal__ok">✓</span><span class="terminal__method">POST</span><span class="terminal__path">/v1/restaurants/42/bookings</span><span class="terminal__code terminal__code--ok">201</span></div>
          <div class="terminal__line"><span class="terminal__ok">✓</span><span class="terminal__method">GET</span><span class="terminal__path">/v1/bookings/c1e2…f8</span><span class="terminal__code terminal__code--ok">200</span></div>
          <div class="terminal__line"><span class="terminal__err">✗</span><span class="terminal__method">POST</span><span class="terminal__path">/v1/restaurants/42/bookings</span><span class="terminal__code terminal__code--err">409</span></div>
          <div class="terminal__line"><span class="terminal__ok">✓</span><span class="terminal__method">PATCH</span><span class="terminal__path">/v1/bookings/c1e2…f8</span><span class="terminal__code terminal__code--ok">200</span></div>
        </div>
        <div class="terminal__summary">e2e: <b>27 passed</b></div>
      </div>
    </div>
  </div>
</div>
<script>
  (function(){
    var el = document.getElementById('ogCode');
    if (!el) return;
    var rows = 36, cols = 100, out = '';
    for (var r = 0; r < rows; r++) { var line = ''; for (var c = 0; c < cols; c++) { line += (Math.random() < 0.5 ? '0' : '1'); } out += line + '\n'; }
    el.textContent = out;
  })();
</script>
</body>
</html>
